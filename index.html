<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven Service</title>
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: all 0.3s;
        }
        
        #login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .input-field {
            width: 300px;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 0 15px;
            margin: 10px 0;
            font-size: 16px;
        }
        
        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        
        .camera-button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 20px;
            background-color: #ffd700;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .camera-button:hover {
            background-color: #ffed4e;
        }
        
        .button {
            width: 300px;
            height: 40px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        
        .yellow-button {
            background-color: #ffd700;
            color: #000;
        }
        
        .red-button {
            background-color: #ff0000;
            color: #fff;
        }
        
        #error-message {
            position: fixed;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff0000;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: all 0.5s;
        }
        
        #error-message.show {
            top: 20px;
            opacity: 1;
        }
        
        #error-message.hide {
            top: -50px;
            opacity: 0;
        }
        
        #main-page {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #fff;
        }
        
        .header {
            background-color: #ffd700;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        
        .section {
            padding: 20px;
            text-align: center;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
        }
        
        .start-button {
            position: relative;
            padding-left: 40px;
        }
        
        .start-button::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background-color: #000;
            border-radius: 5px;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background-color: #666;
            padding: 20px;
            border-radius: 20px;
            width: 400px;
            position: relative;
        }
        
        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 24px;
            color: #fff;
        }
        
        .scooter-item {
            background-color: #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .scooter-item img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }
        
        .shift-status {
            color: red;
        }
        
        .shift-status.active {
            color: green;
        }

        #file-input {
            display: none;
        }

        #processing-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffa500;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
        }
</style>
    <!-- Добавляем Tesseract.js для OCR распознавания текста -->
    <script src='https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js'></script>
  </head>
  <body>
    <div id="login-page">
	  <h2>Вход</h2>
	  <input type="text" id="username" class="input-field" placeholder="Логин">
	  <input type="password" id="password" class="input-field" placeholder="Пароль">
	  <button id="login-button" class="button yellow-button">Войти</button>
    </div>

    <div id="error-message">Неверный логин или пароль</div>

    <div id="processing-message">Обработка фото...</div>

    <div id="main-page">
	  <div class="header">Eleven service</div>
	  <div class="section">
		<h2>Статистика</h2>
		<div class="stat">
		  <span>Сегодня перегонов</span>
		  <span id="today-runs">0</span>
		</div>
		<div class="stat">
		  <span>За 10 дней перегонов</span>
		  <span id="ten-day-runs">0</span>
		</div>
		<div class="stat">
		  <span>BYN</span>
		  <span id="byn">0.00</span>
		</div>
	  </div>
	  <div class="section">
		<h2>Перегон</h2>
		<button id="start-run-button" class="button yellow-button start-button">Начать перегон</button>
	  </div>
	  <div id="modal" class="modal">
		<div class="modal-content">
		  <span class="close">&times;</span>
		  <h3>Номер самоката</h3>
		  <div class="input-container">
			<input type="text" id="scooter-number" class="input-field" maxlength="6" pattern="\d{6}">
			<button id="camera-button" class="camera-button" title="Сканировать камерой">📷</button>
		  </div>
		  <input type="file" id="file-input" accept="image/*" capture="environment">
		  <button id="start-scooter-button" class="button yellow-button">Начать</button>
		  <h3>Самокаты на перегоне</h3>
		  <div id="scooters-list"></div>
		</div>
	  </div>
	  <div class="section">
		<h2>Смена</h2>
		<div class="stat">
		  <span>На линии</span>
		  <span id="on-line">0</span>
		</div>
		<div class="stat">
		  <span>Город</span>
		  <span>Брест</span>
		</div>
		<div class="stat">
		  <span>Смена</span>
		  <span id="shift-status" class="shift-status">Не на смене</span>
		</div>
		<button id="shift-button" class="button yellow-button">Начать смену</button>
	  </div>
	  <div class="section">
		<button id="logout-button" class="button red-button">Выход из аккаунта</button>
	  </div>
    </div>

<script>
        // Load data from localStorage
        let todayRuns = parseInt(localStorage.getItem('todayRuns')) || 0;
        let tenDayRuns = parseInt(localStorage.getItem('tenDayRuns')) || 0;
        let byn = parseFloat(localStorage.getItem('byn')) || 0.00;
        let shiftActive = localStorage.getItem('shiftActive') === 'true';
        let scooters = JSON.parse(localStorage.getItem('scooters')) || [];
        let onLine = shiftActive ? 1 : 0;
        let loggedIn = localStorage.getItem('loggedIn') === 'true';
        
        // Check login status and show appropriate page
        if (loggedIn) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'flex';
        } else {
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('main-page').style.display = 'none';
        }
        
        // Update UI
        document.getElementById('today-runs').textContent = todayRuns;
        document.getElementById('ten-day-runs').textContent = tenDayRuns;
        document.getElementById('byn').textContent = byn.toFixed(2);
        document.getElementById('on-line').textContent = onLine;
        document.getElementById('shift-status').textContent = shiftActive ? 'На смене' : 'Не на смене';
        document.getElementById('shift-status').classList.toggle('active', shiftActive);
        document.getElementById('shift-button').textContent = shiftActive ? 'Закончить смену' : 'Начать смену';
        
        // Render scooters
        function renderScooters() {
            const list = document.getElementById('scooters-list');
            list.innerHTML = '';
            scooters.forEach((scooter, index) => {
                const item = document.createElement('div');
                item.className = 'scooter-item';
                item.innerHTML = `
                    <img src="scooter.jpg"alt="Scooter">
                    <span>${scooter.number}</span>
                    <button class="button yellow-button" onclick="finishScooter(${index})">Завершить</button>
                `;
                list.appendChild(item);
            });
        }
        renderScooters();
        
        // Login
        document.getElementById('login-button').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username === 'alex9' && password === 'elevennice') {
                loggedIn = true;
                localStorage.setItem('loggedIn', 'true');
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-page').style.display = 'flex';
            } else {
                const error = document.getElementById('error-message');
                error.textContent = 'Неверный логин или пароль';
                error.classList.add('show');
                setTimeout(() => {
                    error.classList.add('hide');
                    setTimeout(() => {
                        error.classList.remove('show', 'hide');
                    }, 500);
                }, 10000);
            }
        });
        
        // Start run modal
        document.getElementById('start-run-button').addEventListener('click', () => {
            if (!shiftActive) {
                const error = document.getElementById('error-message');
                error.textContent = 'Вы не на смене';
                error.classList.add('show');
                setTimeout(() => {
                    error.classList.add('hide');
                    setTimeout(() => {
                        error.classList.remove('show', 'hide');
                    }, 500);
                }, 10000);
            } else {
                document.getElementById('modal').classList.add('show');
            }
        });
        
        // Close modal
        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('show');
        });
        
        // Camera scan functionality
        document.getElementById('camera-button').addEventListener('click', () => {
            const fileInput = document.getElementById('file-input');
            fileInput.click(); // Открывает камеру на мобильных устройствах (capture="environment")
        });

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const error = document.getElementById('error-message');
            const processing = document.getElementById('processing-message');
            processing.style.display = 'block'; // Показываем сообщение "Обработка фото..."

            try {
                // Используем Tesseract.js для OCR с настройками для цифр
                const { data: { text } } = await Tesseract.recognize(file, 'eng', {
                    tessedit_char_whitelist: '0123456789', // Только цифры для лучшего распознавания
                    tessedit_pageseg_mode: '6', // Режим для блоков текста (лучше для номеров)
                    logger: m => console.log(m) // Логи для отладки
                });

                // Очищаем текст от пробелов и ищем последовательные цифры
                const cleanedText = text.replace(/\s+/g, ''); // Убираем пробелы
                const match = cleanedText.match(/\d{6}/); // Ищем 6 цифр подряд

                if (match) {
                    const number = match[0];
                    document.getElementById('scooter-number').value = number; // Сразу вводим в поле
                    processing.style.display = 'none'; // Скрываем сообщение обработки
                    // Не показываем баннер успеха, чтобы не отвлекать — номер уже введен
                } else {
                    // Если не найдено 6 цифр, попробуем найти любые цифры и ввести первые 6
                    const allDigits = cleanedText.match(/\d/g);
                    if (allDigits && allDigits.length >= 6) {
                        const number = allDigits.slice(0, 6).join('');
                        document.getElementById('scooter-number').value = number; // Вводим первые 6 цифр
                        processing.style.display = 'none';
                    } else {
                        processing.style.display = 'none';
                        error.textContent = 'Не удалось распознать номер. Проверьте фото и попробуйте снова.';
                        error.classList.add('show');
                        setTimeout(() => {
                            error.classList.remove('show');
                        }, 3000);
                    }
                }
            } catch (err) {
                processing.style.display = 'none';
                error.textContent = 'Ошибка распознавания. Убедитесь, что фото четкое.';
                error.classList.add('show');
                setTimeout(() => {
                    error.classList.remove('show');
                }, 3000);
                console.error('OCR Error:', err);
            }

            // Очищаем input
            event.target.value = '';
        });
        
        // Start scooter
        document.getElementById('start-scooter-button').addEventListener('click', () => {
            const number = document.getElementById('scooter-number').value;
            if (number.length === 6 && /^\d+$/.test(number)) {
                scooters.push({ number });
                localStorage.setItem('scooters', JSON.stringify(scooters));
                renderScooters();
                document.getElementById('scooter-number').value = '';
            }
        });
        
        // Finish scooter
        function finishScooter(index) {
            scooters.splice(index, 1);
            todayRuns++;
            tenDayRuns++;
            byn += 0.68;
            localStorage.setItem('todayRuns', todayRuns);
            localStorage.setItem('tenDayRuns', tenDayRuns);
            localStorage.setItem('byn', byn.toFixed(2)); // Сохраняем с точностью
            localStorage.setItem('scooters', JSON.stringify(scooters));
            document.getElementById('today-runs').textContent = todayRuns;
            document.getElementById('ten-day-runs').textContent = tenDayRuns;
            document.getElementById('byn').textContent = byn.toFixed(2);
            renderScooters();
        }
        
        // Shift button
        document.getElementById('shift-button').addEventListener('click', () => {
            if (!shiftActive) {
                // Начать смену
                shiftActive = true;
                onLine = 1;
                document.getElementById('shift-status').textContent = 'На смене';
                document.getElementById('shift-status').classList.add('active');
                document.getElementById('shift-button').textContent = 'Закончить смену';
                document.getElementById('on-line').textContent = onLine;
                localStorage.setItem('shiftActive', shiftActive);
            } else {
                // Завершить смену - проверить, есть ли самокаты
                if (scooters.length > 0) {
                    const error = document.getElementById('error-message');
                    error.textContent = 'Закончите все перегоны';
                    error.classList.add('show');
                    setTimeout(() => {
                        error.classList.add('hide');
                        setTimeout(() => {
                            error.classList.remove('show', 'hide');
                        }, 500);
                    }, 10000);
                } else {
                    shiftActive = false;
                    onLine = 0;
                    document.getElementById('shift-status').textContent = 'Не на смене';
                    document.getElementById('shift-status').classList.remove('active');
                    document.getElementById('shift-button').textContent = 'Начать смену';
                    document.getElementById('on-line').textContent = onLine;
                    localStorage.setItem('shiftActive', shiftActive);
                }
            }
        });
        
        // Logout
        document.getElementById('logout-button').addEventListener('click', () => {
            loggedIn = false;
            localStorage.setItem('loggedIn', 'false');
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('login-page').style.display = 'flex';
            // Данные не сбрасываются, сохраняются в localStorage для следующего входа
        });
</script>
  </body>
</html>
