<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven Service</title>
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: all 0.3s;
        }
        
        #login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .input-field {
            width: 300px;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 0 15px;
            margin: 10px 0;
            font-size: 16px;
        }
        
        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        
        .camera-button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 20px;
            background-color: #ffd700;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .camera-button:hover {
            background-color: #ffed4e;
        }
        
        .button {
            width: 300px;
            height: 40px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        
        .yellow-button {
            background-color: #ffd700;
            color: #000;
        }
        
        .red-button {
            background-color: #ff0000;
            color: #fff;
        }
        
        #error-message {
            position: fixed;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff0000;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: all 0.5s;
        }
        
        #error-message.show {
            top: 20px;
            opacity: 1;
        }
        
        #error-message.hide {
            top: -50px;
            opacity: 0;
        }
        
        #main-page {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #fff;
        }
        
        .header {
            background-color: #ffd700;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        
        .section {
            padding: 20px;
            text-align: center;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
        }
        
        .start-button {
            position: relative;
            padding-left: 40px;
        }
        
        .start-button::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background-color: #000;
            border-radius: 5px;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background-color: #666;
            padding: 20px;
            border-radius: 20px;
            width: 400px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 24px;
            color: #fff;
        }
        
        .scooter-item {
            background-color: #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .scooter-item img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }
        
        .shift-status {
            color: red;
        }
        
        .shift-status.active {
            color: green;
        }

        #file-input {
            display: none;
        }

        #processing-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffa500;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
        }

        /* Новые стили для камеры */
        #camera-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 1000;
        }

        #camera-modal.show {
            opacity: 1;
            visibility: visible;
        }

        #camera-modal .modal-content {
            background-color: #000;
            padding: 0;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #camera-video {
            width: 100%;
            max-height: 60vh;
            border-radius: 10px 10px 0 0;
        }

        #camera-controls {
            padding: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: #333;
            border-radius: 0 0 10px 10px;
        }

        #capture-photo {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #close-camera {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
</style>
    <!-- Добавляем Tesseract.js для OCR распознавания текста -->
    <script src='https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js'></script>
    <!-- Добавляем jsQR для сканирования QR-кодов -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  </head>
  <body>
    <div id="login-page">
	  <h2>Вход</h2>
	  <input type="text" id="username" class="input-field" placeholder="Логин">
	  <input type="password" id="password" class="input-field" placeholder="Пароль">
	  <button id="login-button" class="button yellow-button">Войти</button>
    </div>

    <div id="error-message">Неверный логин или пароль</div>

    <div id="processing-message">Обработка фото...</div>

    <div id="main-page">
	  <div class="header">Eleven service</div>
	  <div class="section">
		<h2>Статистика</h2>
		<div class="stat">
		  <span>Сегодня перегонов</span>
		  <span id="today-runs">0</span>
		</div>
		<div class="stat">
		  <span>За 10 дней перегонов</span>
		  <span id="ten-day-runs">0</span>
		</div>
		<div class="stat">
		  <span>BYN</span>
		  <span id="byn">0.00</span>
		</div>
	  </div>
	  <div class="section">
		<h2>Перегон</h2>
		<button id="start-run-button" class="button yellow-button start-button">Начать перегон</button>
	  </div>
	  <div id="modal" class="modal">
		<div class="modal-content">
		  <span class="close">&times;</span>
		  <h3>Номер самоката</h3>
		  <div class="input-container">
			<input type="text" id="scooter-number" class="input-field" maxlength="6" pattern="\d{6}">
			<button id="camera-button" class="camera-button" title="Сканировать камерой">📷</button>
		  </div>
		  <input type="file" id="file-input" accept="image/*" capture="environment">
		  <button id="start-scooter-button" class="button yellow-button">Начать</button>
		  <h3>Самокаты на перегоне</h3>
		  <div id="scooters-list"></div>
		</div>
	  </div>
	  <div class="section">
		<h2>Смена</h2>
		<div class="stat">
		  <span>На линии</span>
		  <span id="on-line">0</span>
		</div>
		<div class="stat">
		  <span>Город</span>
		  <span>Брест</span>
		</div>
		<div class="stat">
		  <span>Смена</span>
		  <span id="shift-status" class="shift-status">Не на смене</span>
		</div>
		<button id="shift-button" class="button yellow-button">Начать смену</button>
	  </div>
	  <div class="section">
		<button id="logout-button" class="button red-button">Выход из аккаунта</button>
	  </div>
    </div>

    <!-- Новый модал для камеры -->
    <div id="camera-modal" class="modal">
	  <div class="modal-content">
		<video id="camera-video" autoplay playsinline></video>
		<div id="camera-controls">
		  <button id="capture-photo">Сделать фото</button>
		  <button id="close-camera">Закрыть</button>
		</div>
	  </div>
    </div>

<script>
        // Load data from localStorage
        let todayRuns = parseInt(localStorage.getItem('todayRuns')) || 0;
        let tenDayRuns = parseInt(localStorage.getItem('tenDayRuns')) || 0;
        let byn = parseFloat(localStorage.getItem('byn')) || 0.00;
        let shiftActive = localStorage.getItem('shiftActive') === 'true';
        let scooters = JSON.parse(localStorage.getItem('scooters')) || [];
        let onLine = shiftActive ? 1 : 0;
        let loggedIn = localStorage.getItem('loggedIn') === 'true';
        
        // Check login status and show appropriate page
        if (loggedIn) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'flex';
        } else {
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('main-page').style.display = 'none';
        }
        
        // Update UI
        document.getElementById('today-runs').textContent = todayRuns;
        document.getElementById('ten-day-runs').textContent = tenDayRuns;
        document.getElementById('byn').textContent = byn.toFixed(2);
        document.getElementById('on-line').textContent = onLine;
        document.getElementById('shift-status').textContent = shiftActive ? 'На смене' : 'Не на смене';
        document.getElementById('shift-status').classList.toggle('active', shiftActive);
        document.getElementById('shift-button').textContent = shiftActive ? 'Закончить смену' : 'Начать смену';
        
        // Render scooters
        function renderScooters() {
            const list = document.getElementById('scooters-list');
            list.innerHTML = '';
            scooters.forEach((scooter, index) => {
                const item = document.createElement('div');
                item.className = 'scooter-item';
                item.innerHTML = `
                    <img src="scooter.png" alt="Scooter">
                    <span>${scooter.number}</span>
                    <button class="button yellow-button" onclick="finishScooter(${index})">Завершить</button>
                `;
                list.appendChild(item);
            });
        }
        renderScooters();
        
        // Login
        document.getElementById('login-button').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username === 'alex9' && password === 'elevennice') {
                loggedIn = true;
                localStorage.setItem('loggedIn', 'true');
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-page').style.display = 'flex';
            } else {
                const error = document.getElementById('error-message');
                error.textContent = 'Неверный логин или пароль';
                error.classList.add('show');
                setTimeout(() => {
                    error.classList.add('hide');
                    setTimeout(() => {
                        error.classList.remove('show', 'hide');
                    }, 500);
                }, 10000);
            }
        });
        
        // Start run modal
        document.getElementById('start-run-button').addEventListener('click', () => {
            if (!shiftActive) {
                const error = document.getElementById('error-message');
                error.textContent = 'Вы не на смене';
                error.classList.add('show');
                setTimeout(() => {
                    error.classList.add('hide');
                    setTimeout(() => {
                        error.classList.remove('show', 'hide');
                    }, 500);
                }, 10000);
            } else {
                document.getElementById('modal').classList.add('show');
            }
        });
        
        // Close modal
        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('show');
        });
        
        // Input filter for scooter number: only digits allowed, remove others immediately
        document.getElementById('scooter-number').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, ''); // Remove all non-digit characters
        });
        
        // Camera scan functionality - updated to open live camera modal
        let videoStream;
        let scanning = false;

        document.getElementById('camera-button').addEventListener('click', async () => {
            const cameraModal = document.getElementById('camera-modal');
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' } // Задняя камера для мобильных
                });
                video.srcObject = videoStream;
                cameraModal.classList.add('show');
                scanning = true;
                scanQRCode();
            } catch (err) {
                console.error('Ошибка доступа к камере:', err);
                const error = document.getElementById('error-message');
                error.textContent = 'Не удалось открыть камеру. Проверьте разрешения.';
                error.classList.add('show');
                setTimeout(() => {
                    error.classList.remove('show');
                }, 3000);
            }

            function scanQRCode() {
                if (!scanning) return;

                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        const qrText = code.data;
                        const match = qrText.match(/\d{6}/); // Предполагаем, что QR содержит 6 цифр
                        if (match) {
                            document.getElementById('scooter-number').value = match[0];
                            stopCamera();
                            return;
                        }
                    }
                }

                requestAnimationFrame(scanQRCode);
            }
        });

        // Capture photo button
        document.getElementById('capture-photo').addEventListener('click', () => {
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'captured.jpg', { type: 'image/jpeg' });
                await processImage(file);
                stopCamera();
            });
        });

        // Close camera modal
        document.getElementById('close-camera').addEventListener('click', () => {
            stopCamera();
        });

        function stopCamera() {
            scanning = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-modal').classList.remove('show');
        }

        // Process image for OCR (fallback if QR not found)
        async function processImage(file) {
            const processing = document.getElementById('processing-message');
            processing.style.display = 'block';

            try {
                // Сначала попробуем QR на захваченном изображении
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        const qrText = code.data;
                        const match = qrText.match(/\d{6}/);
                        if (match) {
                            document.getElementById('scooter-number').value = match[0];
                            processing.style.display = 'none';
                            return;
                        }
                    }

                    // Если QR не найден, переходим к OCR
                    performOCR(file);
                };
                img.src = URL.createObjectURL(file);
            } catch (err) {
                performOCR(file);
            }
        }

        async function performOCR(file) {
            const processing = document.getElementById('processing-message');
            const error = document.getElementById('error-message');

            try {
                const { data: { text } } = await Tesseract.recognize(file, 'eng', {
                    tessedit_char_whitelist: '0123456789',
                    tessedit_pageseg_mode: '6',
                    logger: m => console.log(m)
                });

                const cleanedText = text.replace(/\s+/g, '');
                const match = cleanedText.match(/\d{6}/);

                if (match) {
                    document.getElementById('scooter-number').value = match[0];
                    processing.style.display = 'none';
                } else {
                    const allDigits = cleanedText.match(/\d/g);
                    if (allDigits && allDigits.length >= 6) {
                        document.getElementById('scooter-number').value = allDigits.slice(0, 6).join('');
                        processing.style.display = 'none';
                    } else {
                        processing.style.display = 'none';
                        error.textContent = 'Не удалось распознать номер. Проверьте фото и попробуйте снова.';
                        error.classList.add('show');
                        setTimeout(() => {
                            error.classList.remove('show');
                        }, 3000);
                    }
                }
            } catch (err) {
                processing.style.display = 'none';
                error.textContent = 'Ошибка распознавания. Убедитесь, что фото четкое.';
                error.classList.add('show');
                setTimeout(() => {
                    error.classList.remove('show');
                }, 3000);
                console.error('OCR Error:', err);
            }
        }

        // Fallback for old file input (if needed)
        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            await processImage(file);
            event.target.value = '';
        });
        
        // Start scooter
        document.getElementById('start-scooter-button').addEventListener('click', () => {
            const number = document.getElementById('scooter-number').value;
            if (number.length === 6 && /^\d+$/.test(number)) {
                scooters.push({ number });
                localStorage.setItem('scooters', JSON.stringify(scooters));
                renderScooters();
                document.getElementById('scooter-number').value = '';
            }
        });
        
        // Finish scooter
        function finishScooter(index) {
            scooters.splice(index, 1);
            todayRuns++;
            tenDayRuns++;
            byn += 0.68;
            localStorage.setItem('todayRuns', todayRuns);
            localStorage.setItem('tenDayRuns', tenDayRuns);
            localStorage.setItem('byn', byn.toFixed(2));
            localStorage.setItem('scooters', JSON.stringify(scooters));
            document.getElementById('today-runs').textContent = todayRuns;
            document.getElementById('ten-day-runs').textContent = tenDayRuns;
            document.getElementById('byn').textContent = byn.toFixed(2);
            renderScooters();
        }
        
        // Shift button
        document.getElementById('shift-button').addEventListener('click', () => {
            if (!shiftActive) {
                // Начать смену
                shiftActive = true;
                onLine = 1;
                document.getElementById('shift-status').textContent = 'На смене';
                document.getElementById('shift-status').classList.add('active');
                document.getElementById('shift-button').textContent = 'Закончить смену';
                document.getElementById('on-line').textContent = onLine;
                localStorage.setItem('shiftActive', shiftActive);
            } else {
                // Завершить смену - проверить, есть ли самокаты
                if (scooters.length > 0) {
                    const error = document.getElementById('error-message');
                    error.textContent = 'Закончите все перегоны';
                    error.classList.add('show');
                    setTimeout(() => {
                        error.classList.add('hide');
                        setTimeout(() => {
                            error.classList.remove('show', 'hide');
                        }, 500);
                    }, 10000);
                } else {
                    shiftActive = false;
                    onLine = 0;
                    document.getElementById('shift-status').textContent = 'Не на смене';
                    document.getElementById('shift-status').classList.remove('active');
                    document.getElementById('shift-button').textContent = 'Начать смену';
                    document.getElementById('on-line').textContent = onLine;
                    localStorage.setItem('shiftActive', shiftActive);
                }
            }
        });
        
        // Logout
        document.getElementById('logout-button').addEventListener('click', () => {
            loggedIn = false;
            localStorage.setItem('loggedIn', 'false');
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('login-page').style.display = 'flex';
            // Данные не сбрасываются, сохраняются в localStorage для следующего входа
        });
</script>
  </body>
</html>
